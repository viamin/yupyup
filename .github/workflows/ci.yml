name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - run: mix format --check-formatted
      - run: mix test
      # GitHub runners ship Java but no TLA+ install, so this exercises the
      # TLC cross-check's skip path end to end: it must print why it is
      # skipping and exit 0.
      - run: bin/tlc-crosscheck
